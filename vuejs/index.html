<div id="app" class="bg-gray-100 min-h-screen p-10">

  <h1 class="text-4xl font-bold text-center mb-10">My Modern Blog</h1>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
    <div v-for="(post, index) in posts" :key="index"
         class="bg-white p-6 rounded-2xl shadow-xl transform transition-transform hover:-translate-y-4 hover:shadow-2xl">
      
      <img :src="post.img" class="rounded-xl mb-4 w-full h-48 object-cover" />
      
      <h2 class="text-2xl font-semibold mb-2">{{ post.title }}</h2>
      
      <p class="text-gray-600 mb-4">{{ post.summary }}</p>
      
      <button class="bg-blue-500 text-white py-2 px-4 rounded-xl hover:bg-blue-600 transition">
        Read More
      </button>
    </div>
  </div>

</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<script>
Vue.createApp({
  data() {
    return {
      posts: [
        { title: "Modern UI Trends", summary: "Learn about 3D UI and interactive designs.", img: "https://via.placeholder.com/400x300?text=Post+1" },
        { title: "Vue.js Components", summary: "How to build reusable components for modern websites.", img: "https://via.placeholder.com/400x300?text=Post+2" },
        { title: "Tailwind CSS Magic", summary: "Creating beautiful designs quickly with Tailwind.", img: "https://via.placeholder.com/400x300?text=Post+3" },
        { title: "Responsive Design", summary: "How to make your site mobile and desktop friendly.", img: "https://via.placeholder.com/400x300?text=Post+4" },
        { title: "3D Hover Effects", summary: "Add depth to your UI with simple CSS transforms.", img: "https://via.placeholder.com/400x300?text=Post+5" },
        { title: "Blog Best Practices", summary: "Tips to make your blog modern and user-friendly.", img: "https://via.placeholder.com/400x300?text=Post+6" },
      ]
    }
  }
}).mount("#app")
</script>
